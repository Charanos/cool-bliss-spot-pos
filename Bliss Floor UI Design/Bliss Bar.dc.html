<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0B1015;overflow:hidden}
  a{color:#6FC6D6;text-decoration:none}
  a:hover{color:#A8DCE6}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>

<div style="height:100vh;display:grid;grid-template-rows:72px 1fr 64px;background:#0B1015;color:#FBFCFD;font-family:'Geist','Helvetica Neue',Helvetica,sans-serif;font-weight:400;font-size:15px;line-height:22px;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden">

  <div style="display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid #38424B;min-width:0">
    <div style="display:flex;align-items:center;gap:10px;flex:0 0 auto">
      <div style="width:26px;height:26px;position:relative">
        <div style="position:absolute;left:0;top:7px;width:17px;height:17px;border-radius:5px;background:#1F6E82"></div>
        <div style="position:absolute;left:9px;top:0;width:17px;height:17px;border-radius:5px;background:#6FC6D6"></div>
      </div>
      <span style="font-size:20px;letter-spacing:-.02em;color:#FBFCFD">bliss</span>
      <span style="font-size:20px;letter-spacing:-.02em;color:#8C9AA6">bar</span>
    </div>
    <div style="flex:1 1 auto;min-width:8px"></div>
    <div style="display:flex;align-items:center;gap:24px;flex:0 0 auto">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
        <div style="text-align:right">
          <div style="font-size:12px;line-height:16px;letter-spacing:.02em;color:#8C9AA6;white-space:nowrap">{{ s.label }}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;font-size:24px;line-height:30px;letter-spacing:-.025em;color:{{ s.ink }}">{{ s.value }}</div>
        </div>
      </sc-for>
      <div style="width:1px;height:40px;background:#38424B"></div>
      <div style="text-align:right">
        <div style="font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:24px;line-height:30px;letter-spacing:-.025em;color:#FBFCFD">21:48</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <div style="width:6px;height:6px;border-radius:50%;background:#63B98A"></div>
          <span style="font-size:12px;color:#63B98A;white-space:nowrap">Live</span>
        </div>
      </div>
    </div>
  </div>

  <div style="overflow-y:auto;overflow-x:hidden;padding:20px 24px 24px;min-height:0">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start">
      <sc-for list="{{ orders }}" as="o" hint-placeholder-count="6">
        <div style="border-radius:10px;background:#232B32;border:1px solid {{ o.stroke }};overflow:hidden">
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #38424B">
            <div style="flex:1 1 auto;min-width:0">
              <div style="font-size:24px;line-height:30px;letter-spacing:-.025em;color:#FBFCFD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.table }}</div>
              <div style="font-size:13px;line-height:18px;color:#B3BFC9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.meta }}</div>
            </div>
            <div style="flex:0 0 auto;text-align:right">
              <div style="font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;font-size:28px;line-height:32px;letter-spacing:-.03em;color:{{ o.clockInk }}">{{ o.clock }}</div>
              <div style="font-size:12px;line-height:16px;color:{{ o.clockInk }};white-space:nowrap">{{ o.age }}</div>
            </div>
          </div>
          <div style="padding:6px 16px 14px">
            <sc-for list="{{ o.lines }}" as="l" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid {{ l.rule }};opacity:{{ l.op }}">
                <div style="flex:0 0 40px;width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:{{ l.seatFill }};border:{{ l.seatBorder }}">
                  <span style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;color:{{ l.seatInk }}">{{ l.seat }}</span>
                </div>
                <span style="flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;font-size:22px;line-height:28px;color:#FBFCFD">{{ l.q }}</span>
                <div style="flex:1 1 auto;min-width:0">
                  <div style="font-size:20px;line-height:26px;letter-spacing:-.015em;color:{{ l.ink }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l.name }}</div>
                  <sc-if value="{{ l.note }}">
                    <div style="font-size:14px;line-height:19px;color:{{ l.noteInk }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.note }}</div>
                  </sc-if>
                </div>
                <div style="flex:0 0 32px;width:32px;height:32px;border-radius:6px;background:{{ l.tickFill }};display:flex;align-items:center;justify-content:center">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4.4 10.6 8 14.2l7.6-8.4" stroke="{{ l.tickInk }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
              </div>
            </sc-for>
            <div style="height:14px"></div>
            <div style="display:flex;gap:8px">
              <div style="flex:0 0 auto;height:48px;border-radius:6px;padding:0 16px;display:flex;align-items:center;background:#38424B;font-size:15px;color:#D4DCE3;white-space:nowrap">{{ o.secondary }}</div>
              <div style="flex:1 1 auto;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:{{ o.primaryFill }};font-size:16px;font-weight:500;letter-spacing:-.01em;color:{{ o.primaryInk }};white-space:nowrap;transition:background-color 160ms cubic-bezier(.22,1,.36,1)">{{ o.primary }}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:16px;padding:0 24px;border-top:1px solid #38424B;min-width:0">
    <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">
        <div style="width:8px;height:8px;border-radius:50%;background:{{ l.dot }}"></div>
        <span style="font-size:14px;color:#B3BFC9;white-space:nowrap">{{ l.label }}</span>
      </div>
    </sc-for>
    <div style="flex:1 1 auto;min-width:8px"></div>
    <span style="font-size:14px;color:#8C9AA6;white-space:nowrap">{{ footNote }}</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  renderVals() {
    const SEAT = ['#6FC6D6','#E0A35A','#9DC271','#B79BE0','#E58BA4','#7FA8E0','#D9C46B','#6FD2B4'];
    const seat = n => SEAT[(n - 1) % 8];

    const line = (s, q, name, o) => {
      o = o || {};
      const poured = !!o.poured;
      return {
        seat: s === 'shared' ? '··' : String(s),
        seatFill: s === 'shared' ? 'transparent' : seat(s),
        seatBorder: s === 'shared' ? '1px dashed #B3BFC9' : 'none',
        seatInk: s === 'shared' ? '#B3BFC9' : '#0B1015',
        q: q + ' ×', name,
        note: o.note || (poured ? 'Poured' : ''),
        noteInk: poured ? '#63B98A' : o.stop ? '#E08585' : '#E0A35A',
        ink: poured ? '#B3BFC9' : '#FBFCFD',
        op: 1,
        rule: '#38424B',
        tickFill: poured ? '#63B98A' : '#38424B',
        tickInk: poured ? '#0B1015' : '#8C9AA6',
      };
    };

    const orders = [
      {
        table:'Table 7', meta:'Amina · tab 1024 · 4 guests',
        clock:'0:38', age:'waiting', urgent:false,
        lines:[
          line(3, 1, 'Smirnoff and Coke', { note:'No ice' }),
          line(2, 1, 'Gilbeys tot', { note:'Double pour' }),
        ],
        secondary:'Hold', primary:'All poured · Table 7',
      },
      {
        table:'Table 9', meta:'Peter · tab 1031 · 2 guests',
        clock:'2:14', age:'waiting', urgent:true,
        lines:[
          line(1, 2, 'Tusker 500ml', { poured:true }),
          line(1, 1, 'White Cap 500ml'),
          line(2, 1, 'Heineken 330ml'),
        ],
        secondary:'Hold', primary:'All poured · Table 9',
      },
      {
        table:'Table 2', meta:'Amina · tab 1019 · 2 guests',
        clock:'0:12', age:'just fired', urgent:false,
        lines:[
          line('shared', 1, 'Nyama choma', { note:'Kitchen, half kilo' }),
          line(1, 1, 'Kenya Cane tot'),
        ],
        secondary:'Hold', primary:'All poured · Table 2',
      },
      {
        table:'Counter 3', meta:'Grace · takeaway · 1 guest',
        clock:'1:02', age:'waiting', urgent:false,
        lines:[
          line(1, 4, 'Tusker 500ml', { note:'Sealed for takeaway' }),
        ],
        secondary:'Hold', primary:'All poured · Counter 3',
      },
      {
        table:'Table 4', meta:'Peter · tab 1008 · 3 guests',
        clock:'3:47', age:'overdue', urgent:true, stop:true,
        lines:[
          line(2, 1, 'Jameson tot', { note:'Finished, ask for a swap', stop:true }),
          line(3, 1, 'Four Cousins glass', { poured:true }),
        ],
        secondary:'Tell the floor', primary:'All poured · Table 4',
      },
      {
        table:'Table 11', meta:'Amina · tab 1036 · 1 guest',
        clock:'0:05', age:'just fired', urgent:false,
        lines:[
          line(1, 1, 'Red Bull 250ml'),
          line(1, 1, 'Dasani 500ml'),
        ],
        secondary:'Hold', primary:'All poured · Table 11',
      },
    ].map(o => ({
      ...o,
      stroke: o.stop ? '#E08585' : o.urgent ? '#E0A35A' : o.age === 'just fired' ? '#6FC6D6' : '#38424B',
      clockInk: o.stop ? '#E08585' : o.urgent ? '#E0A35A' : o.age === 'just fired' ? '#6FC6D6' : '#B3BFC9',
      primaryFill: '#6FC6D6',
      primaryInk: '#0B1015',
    }));

    return {
      orders,
      stats: [
        { label:'Orders waiting', value:'6', ink:'#FBFCFD' },
        { label:'Lines to pour', value:'13', ink:'#FBFCFD' },
        { label:'Longest wait', value:'3:47', ink:'#E08585' },
      ],
      legend: [
        { dot:'#63B98A', label:'Poured' },
        { dot:'#E0A35A', label:'Over two minutes' },
        { dot:'#E08585', label:'Needs the floor' },
        { dot:'#6FC6D6', label:'Just fired' },
      ],
      footNote: 'Seat numbers match the tablet and the printed bill',
    };
  }
}

</script>
</body>
</html>
